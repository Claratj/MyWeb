<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F2F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101717" media="(prefers-color-scheme: dark)" />
    <!-- The page follows the device theme (prefers-color-scheme in tokens.css).
         Pre-paint a stored override so it never flashes; an override that now
         matches the device is dropped, so the page follows the OS again. -->
    <script>
      try {
        var t = localStorage.getItem("ct-theme");
        var sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === sys) localStorage.removeItem("ct-theme");
        else if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Clara Toloba, Frontend Engineer specialising in design systems and product UI. Tokens generated from Figma, lint guardrails, accessibility audits. React, TypeScript. Remote, EU/global."
    />
    <meta name="author" content="Clara Toloba" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clara Toloba, Frontend Engineer · Product UI &amp; Design Systems" />
    <meta
      property="og:description"
      content="I build design systems that hold up in code. React, TypeScript."
    />
    <meta property="og:url" content="https://claratoloba.com" />

    <title>Clara Toloba · Frontend Engineer · Product UI &amp; Design Systems</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
