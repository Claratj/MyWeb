<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F2F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101717" media="(prefers-color-scheme: dark)" />
    <!-- Pre-paint the stored theme so a returning dark-mode visitor never sees a light flash -->
    <script>
      try {
        var t = localStorage.getItem("ct-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Clara Toloba, Frontend Engineer specialising in design systems and product UI. Tokens generated from Figma, lint guardrails, accessibility audits. React, TypeScript. Remote, EU/global."
    />
    <meta name="author" content="Clara Toloba" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clara Toloba, Frontend Engineer · Product UI &amp; Design Systems" />
    <meta
      property="og:description"
      content="I build design systems that hold up in code. React, TypeScript."
    />
    <meta property="og:url" content="https://claratoloba.com" />

    <title>Clara Toloba · Frontend Engineer · Product UI &amp; Design Systems</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
