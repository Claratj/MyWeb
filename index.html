<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts the hero paints first: start downloading them with the HTML
         instead of waiting for the CSS to arrive. Vite rewrites the hashed urls. -->
    <link rel="preload" href="/src/assets/fonts/Montserrat/Montserrat-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Mulish/Mulish-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F2F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101717" media="(prefers-color-scheme: dark)" />
    <!-- The page follows the device theme (prefers-color-scheme in tokens.css).
         Pre-paint a stored override so it never flashes; an override that now
         matches the device is dropped, so the page follows the OS again. -->
    <script>
      try {
        var t = localStorage.getItem("ct-theme");
        var sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === sys) localStorage.removeItem("ct-theme");
        else if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Clara Toloba, Frontend Engineer for design systems and product UI: Figma tokens, lint guardrails, accessibility audits. React, TypeScript. Remote, EU."
    />
    <meta name="author" content="Clara Toloba" />
