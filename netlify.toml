[build]
  # Type errors or a failing test stop the deploy before anything ships.
  command = "npm run typecheck && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: any unknown path serves the single page instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. None of them change how the page looks or behaves:
# HTTPS only, no MIME sniffing, no framing by other sites, minimal referrer,
# and no access to device features the site never uses.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
