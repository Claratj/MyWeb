<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" />
    <title>Page not found · Clara Toloba</title>
    <!-- Standalone page served by Netlify for unknown paths, outside the Vite
         bundle, so it can't read tokens.css: the values below mirror
         --c-n1, --c-n3, --c-plum, --c-orange-deep, --c-d1, --c-orange-light. -->
    <style>
      :root { color-scheme: light dark; --bg: #f7f2f5; --ink: #0b2027; --head: #4d0c3e; --link: #a2361a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101717; --ink: #f7f2f5; --head: #f7f2f5; --link: #f38362; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
             background: var(--bg); color: var(--ink); font: 400 1.125rem/1.6 "Mulish", system-ui, -apple-system, sans-serif; text-align: center; }
      h1 { margin: 0 0 8px; color: var(--head); font: 800 clamp(2.5rem, 8vw, 4.5rem)/1.05 "Montserrat", "Segoe UI", system-ui, sans-serif; }
      a { color: var(--link); font-weight: 700; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This address doesn’t exist. <a href="/">Go to claratoloba.com</a></p>
    </main>
  </body>
</html>
